version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 3
  - package-ecosystem: "gradle"
    directory: "/"
    cooldown:
      default-days: 3
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 3
  - package-ecosystem: "npm"
    directory: "/frontend"
    cooldown:
      default-days: 3
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 3
